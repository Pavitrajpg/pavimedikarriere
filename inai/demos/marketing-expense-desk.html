summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input{flex:1 1 220px}
.toolbar select{width:auto}
.tag{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:2px}
.paper{border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--surface);min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:6px 24px;margin-bottom:6px;font-size:14px}
.k{color:var(--muted);font-size:12px}
.ptitle{font-size:13px;font-weight:600;margin:18px 0 6px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
.tbl th{font-weight:600;text-align:left;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;font-size:12px}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right;font-family:var(--sans)}
.tbl tfoot td{font-weight:600;border-bottom:0}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.sums{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sums .mono{font-weight:500}
.sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.vouch{margin-top:16px}
.vtop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.vtop h3{margin:0;font-size:15px}
.vrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:5}
#toast.on{opacity:1}
@media (max-width:760px){
  .grid,.two{grid-template-columns:minmax(0,1fr)}
  .tiles,.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row,.row3{grid-template-columns:minmax(0,1fr)}
  .row4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stmt,.sign{grid-template-columns:minmax(0,1fr)}

@media (prefers-reduced-motion:reduce){#toast{transition:none}}

    h+='<div class="ptitle">Travel expenses report</div><div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>From</th><th>To</th><th class="n">Fare</th><th class="n">Meals</th><th class="n">Conv.</th><th class="n">Misc</th><th class="n">Total</th></tr></thead><tbody>'+

      '</tbody><tfoot><tr><td colspan="3">Total</td><td class="n">'+tf+'</td><td class="n">'+tm+'</td><td class="n">'+tc+'</td><td class="n">'+tx+'</td><td class="n">'+tot+'</td></tr></tfoot></table></div>';
    h+='<div class="two"><div><div class="ptitle">Advance details</div><div class="scroll"><table class="tbl" style="min-width:0"><thead><tr><th>Date</th><th class="n">Amount</th></tr></thead><tbody>'+
      (bf?'<tr><td>Brought forward</td><td class="n">'+bf+'</td></tr>':'')+(A.length?A.map(function(a){return '<tr><td>'+fdate(a.date)+'</td><td class="n">'+a.amt+'</td></tr>'}).join(''):'<tr><td colspan="2" class="note">None</td></tr>')+'</tbody><tfoot><tr><td>Total</td><td class="n">'+g+'</td></tr></tfoot></table></div></div>'+

    h+='<div class="sums"><span><span class="k">Total</span> <span class="mono">'+inr(g)+'</span> given</span><span><span class="k">Less exp.</span> <span class="mono">'+inr(tot)+'</span></span><span><span class="k">Balance</span> <span class="mono">'+inr(Math.abs(bal))+'</span> '+(bal<0?'payable to '+esc(u):bal>0?'left, carried forward to the next report':'nil')+'</span></div>';
    var st=c.status;

  /* ---------- staff: calendar day log ---------- */
  function visitRow(v,showBy,canEdit){

      '<div class="meta">'+(showBy?esc(v.by)+' ('+BRANCH[v.by]+') · ':'')+fdate(v.date)+' · '+esc(v.area)+(v.addr?' · '+esc(v.addr):'')+(v.remarks?' · '+esc(v.remarks):'')+(v.bill?' · Bill '+inr(v.bill):'')+(v.card?'<span class="chip photo">Card photo</span>':'')+'</div>'+

      (canEdit?'<div class="act"><button class="btn link" type="button" data-del="'+e.id+'">Remove</button></div>':'')+'</div>';

  function calHTML(u){
    var off=(new Date(2026,9,1).getDay()+6)%7,h='';

    for(var i=0;i<off;i++) h+='<div></div>';

      var ds='2026-10-'+pad(d);
      var hasV=visits.some(function(v){return v.by===u&&v.date===ds}),hasE=entries.some(function(e){return e.by===u&&e.date===ds});
      var dots=(hasV?'<span class="dot v"></span>':'')+(hasE?'<span class="dot e"></span>':'');
      h+='<button type="button" data-day="'+ds+'" class="'+(ds===S.day?'sel ':'')+(ds===TODAY?'today':'')+'"'+(ds>TODAY?' disabled':'')+' aria-label="'+d+' October"><span>'+d+'</span><span class="dots">'+dots+'</span></button>';
    }
    return '<div class="cal">'+h+'</div><div class="legend"><span><i class="dot v"></i>Visits</span><span><i class="dot e"></i>Expenses</span></div>';

      '<div class="row"><div class="field"><label for="vAddr">Address</label><input id="vAddr" type="text"></div><div class="field"><label for="vPhone">Phone number</label><input id="vPhone" type="text" inputmode="tel"></div></div>'+

  /* ---------- directory ---------- */

      '<button class="btn" type="submit">Add</button><p class="note">These fill the Advance details on each report. Amounts can differ every month and per person. A trip advance is just another line.</p></form></section>'+
      '<section class="card"><h2>Given so far</h2>'+rowsH+'</section></div>';
  }
  function viewFunds(){
    var f=S.ff,fb=S.fb;
    var base=funds.filter(function(x){return fb==='all'||x.branch===fb});
    var l=base.filter(function(x){return f==='all'||x.kind===f}).sort(function(a,b){return a.date<b.date?1:-1});
    var inn=0,out=0,byHead={};
    base.forEach(function(x){if(x.kind==='in')inn+=x.amt;else{out+=x.amt;byHead[x.head]=(byHead[x.head]||0)+x.amt}});
    var bars=Object.keys(byHead).sort(function(a,b){return byHead[b]-byHead[a]}).map(function(k){return '<div class="bar"><div class="lab"><span>'+esc(k)+'</span><span class="mono">'+inr(byHead[k])+'</span></div><div class="track"><div class="fill" style="width:'+Math.round(byHead[k]/(out||1)*100)+'%"></div></div></div>'}).join('');
    var fl=[['all','All'],['in','Income'],['out','Expenses']];
    return '<p class="note" style="margin:0 0 14px">Visible to the owner only. Staff and the checker never see this screen.</p>'+chips('data-fb',fb)+
      '<div class="tiles t3"><div class="tile"><div class="k">Money in</div><div class="v">'+inr(inn)+'</div></div><div class="tile"><div class="k">Money out</div><div class="v">'+inr(out)+'</div></div><div class="tile"><div class="k">Balance for the month</div><div class="v">'+inr(inn-out)+'</div></div></div>'+
      '<div class="grid"><section class="card"><h2>Add income or expense<span class="tag">Phase 2</span></h2><form id="fundForm">'+
      '<div class="row3"><div class="field"><label for="uKind">Type</label><select id="uKind"><option value="in">Income</option><option value="out">Expense</option></select></div><div class="field"><label for="uHead">Head</label><select id="uHead">'+HEADS.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select></div><div class="field"><label for="uBr">Branch</label><select id="uBr"><option>Madurai</option><option>Trichy</option></select></div></div>'+
      '<div class="row"><div class="field"><label for="uDate">Date</label><input id="uDate" type="date" value="'+TODAY+'" required></div><div class="field"><label for="uAmt">Amount (\u20B9)</label><input id="uAmt" type="number" min="1" inputmode="numeric" required></div></div>'+
      '<div class="field"><label for="uNote">Note</label><input id="uNote" type="text" required></div><button class="btn" type="submit">Save</button><p class="note">When a staff member confirms a cash voucher, it is posted here automatically under their branch.</p></form>'+
      '<div class="sec">Money out by head</div><div class="bars">'+bars+'</div></section>'+
      '<section class="card"><h2>Office ledger, October</h2><div class="toolbar">'+fl.map(function(x){return '<button class="btn sm '+(f===x[0]?'':'ghost')+'" type="button" data-ff="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div><div class="list">'+
      l.map(function(x){return '<div class="item"><div class="top">'+esc(x.head)+'</div><div class="amt" style="color:'+(x.kind==='in'?'var(--ok)':'var(--ink)')+'">'+(x.kind==='in'?'+':'\u2212')+inr(x.amt)+'</div><div class="meta">'+fdate(x.date)+' \u00B7 '+esc(x.branch)+' \u00B7 '+esc(x.note)+'</div></div>'}).join('')+'</div></section></div>';
  }

  function render(){
    renderTabs();
    $('panel').innerHTML={month:viewMonth,report:viewReport,visits:viewVisits,check:viewCheck,dash:viewDash,allow:viewAllow,funds:viewFunds}[S.tab]();
    $('roleStaff').setAttribute('aria-pressed',S.role==='staff');
    $('roleCheck').setAttribute('aria-pressed',S.role==='check');
    $('roleBoss').setAttribute('aria-pressed',S.role==='boss');
    $('staffPick').hidden=S.role!=='staff';
  }
  function setRole(r,tab){S.role=r;S.tab=tab;S.asking=null;render()}
  $('staffPick').innerHTML=staff.map(function(s){return '<option value="'+s+'">'+s+', '+BRANCH[s]+'</option>'}).join('');
  $('staffPick').onchange=function(){S.user=this.value;S.tab='month';S.day=TODAY;render()};
  $('roleStaff').onclick=function(){setRole('staff','month')};
  $('roleCheck').onclick=function(){setRole('check','check')};
  $('roleBoss').onclick=function(){setRole('boss','dash')};

  document.addEventListener('change',function(ev){
    var id=ev.target.id;
    if(id==='vStaff')$('visList').innerHTML=visitList();
    if(id==='rFrom'||id==='rTo'){var c=claims[S.user],f=$('rFrom').value,t=$('rTo').value;if(f&&t&&f<=t){c.from=f;c.to=t;render()}else toast('Start date must be before the end date')}
  });
  document.addEventListener('input',function(ev){if(ev.target.id==='vSearch')$('visList').innerHTML=visitList()});
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;var d=b.dataset,c;
    if(d.tab){S.tab=d.tab;S.asking=null;render()}
    else if(d.day){S.day=d.day;render()}
    else if(d.del){entries=entries.filter(function(x){return x.id!=d.del});render()}
    else if(d.delvis){visits=visits.filter(function(x){return x.id!=d.delvis});render()}
    else if(d.deladv){advances=advances.filter(function(x){return x.id!=d.deladv});render()}
    else if(d.ff){S.ff=d.ff;render()}
    else if(d.fb){S.fb=d.fb;render()}
    else if(d.br){S.branch=d.br;render()}
    else if(d.file){c=claims[S.user];c.status='filed';c.filedOn=fdate(TODAY);c.checkedBy=null;delete c.question;toast('Report filed. It goes to the checker.');render()}
    else if(d.check){c=claims[d.check];c.status='checked';c.checkedBy='Accounts';c.checkedOn=fdate(TODAY);toast('Marked checked. It is now with the boss.');render()}
    else if(d.approve){c=claims[d.approve];c.status='approved';c.approvedOn=fdate(TODAY);if(!c.checkedBy){c.checkedBy='Boss';c.checkedOn=fdate(TODAY)}
      var pv=payable(d.approve);c.carry=Math.max(0,given(d.approve)-spent(d.approve));if(pv>0){c.voucher={ref:nextId.vch++,date:fdate(TODAY),amt:pv,received:false};toast('Approved. Cash voucher '+c.voucher.ref+' issued for '+inr(pv))}else toast('Approved. '+(c.carry?inr(c.carry)+' carries forward.':'Nothing to pay.'));render()}
    else if(d.next){c=claims[S.user];var nf=new Date(c.to+'T00:00:00');nf.setDate(nf.getDate()+1);claims[S.user]={opening:c.carry||0,from:nf.getFullYear()+'-'+pad(nf.getMonth()+1)+'-'+pad(nf.getDate()),to:'2026-10-31',status:'open'};S.tab='month';toast('New report started');render()}
    else if(d.rcv){c=claims[d.rcv];c.voucher.received=true;c.voucher.receivedOn=fdate(TODAY);
      funds.push({id:nextId.f++,date:TODAY,kind:'out',head:'Staff allowances',branch:BRANCH[d.rcv],note:'Voucher '+c.voucher.ref+', '+d.rcv+', '+fdate(c.from)+' to '+fdate(c.to),amt:c.voucher.amt});toast('Confirmed. Posted to office funds.');render()}
    else if(d.ask){S.asking=d.ask;render();var t=$('askText');if(t)t.focus()}
    else if(d.cancelask){S.asking=null;render()}
    else if(d.sendask){var q=$('askText').value.trim();if(!q){$('askText').focus();toast('Type your question first');return}
      c=claims[d.sendask];c.status='query';c.question=q;c.by=S.role==='boss'?'Boss':'Checker';c.checkedBy=null;S.asking=null;toast('Sent back to '+d.sendask);render()}
  });
  document.addEventListener('submit',function(ev){
    ev.preventDefault();var id=ev.target.id;
    function n(x){return +$(x).value||0}
    if(id==='expForm'){
      var fare=n('fFare'),meals=n('fMeals'),conv=n('fConv'),misc=n('fMisc'),note=$('fNote').value.trim();
      if(!(fare+meals+conv+misc)){toast('Add at least one amount');return}
      if(misc&&!note){$('fNote').focus();toast('Say what the miscellaneous amount was for');return}
      entries.push(R(nextId.e++,S.user,S.day,$('fFrom').value.trim(),$('fTo').value.trim(),fare,meals,conv,misc,note,$('fBill').files.length>0));toast('Added');render();
    }else if(id==='visForm'){
      visits.push(V(nextId.v++,S.user,S.day,$('vArea').value.trim(),$('vShop').value.trim(),$('vJc').value.trim(),$('vRem').value.trim(),n('vBill'),$('vAddr').value.trim(),$('vPhone').value.trim(),$('vCard').files.length>0));toast('Added');render();
    }else if(id==='advForm'){
      advances.push({id:nextId.a++,to:$('aTo').value,date:$('aDate').value,label:$('aLabel').value.trim(),amt:n('aAmt')});toast('Added for '+$('aTo').value);render();
    }else if(id==='fundForm'){
      funds.push({id:nextId.f++,date:$('uDate').value,kind:$('uKind').value,head:$('uHead').value,branch:$('uBr').value,note:$('uNote').value.trim(),amt:n('uAmt')});toast('Saved');render();
    }
  });
  render();
})();
</script>

</body></html>
