<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INAI · Theatre.js motion example</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg">
<style>
:root{--navy:#0F172A;--gold:#B8860B;--gold2:#D4A843;--ivory:#F8F6F2}
*{box-sizing:border-box;margin:0}
body{background:var(--ivory);color:var(--navy);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:2rem 1rem}
.card{width:min(560px,100%);text-align:center}
.stage{background:var(--navy);aspect-ratio:1;border-radius:4px;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(15,23,42,.5)}
svg{width:100%;height:100%;display:block}
.dot{fill:#D4A843}.ln{fill:none;stroke:#D4A843;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.word{font-family:'Cormorant Garamond',Georgia,serif;fill:#F8F6F2;letter-spacing:.5em}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:1.7rem;margin:1.6rem 0 .4rem}
p{color:#566075;line-height:1.6;font-size:.95rem}
.row{display:flex;gap:.6rem;justify-content:center;margin-top:1.2rem}
button{font:inherit;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;padding:.75rem 1.4rem;border:1px solid var(--navy);background:var(--navy);color:var(--ivory);cursor:pointer}
button.o{background:transparent;color:var(--navy)}
.ro{font-size:.8rem;color:#566075;margin-top:1rem;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="card">
 <div class="stage">
  <svg viewBox="0 0 400 400" aria-label="A kolam drawing itself">
   <defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="blur" stdDeviation="0"/></filter></defs>
   <g id="rot" transform="translate(200 190)">
    <g id="dots"></g>
    <g id="glowG" filter="url(#gl)" opacity="0"><path id="gpath" class="ln" style="stroke-width:5"/></g>
    <path id="loop" class="ln"/>
   </g>
   <text id="word" class="word" x="200" y="356" text-anchor="middle" font-size="30" opacity="0">INAI</text>
  </svg>
 </div>
 <h1>One line, drawn once.</h1>
 <p>A kolam is a single unbroken line around a grid of dots. This is that idea, animated with Theatre.js: dots appear, the line draws itself, the whole figure settles, then the name arrives.</p>
 <div class="row"><button id="play">Replay</button><button class="o" id="pause">Pause</button></div>
 <div class="ro" id="ro"></div>
</div>
<script src="assets/theatre-core.min.js"></script>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
/* diamond dot grid: 1-3-5-3-1 rows, spacing 56 */
const S=56,rows=[1,3,5,3,1];let pts=[];
rows.forEach((n,r)=>{for(let i=0;i<n;i++)pts.push([(i-(n-1)/2)*S,(r-2)*S])});
const dots=document.getElementById('dots');
pts.forEach(p=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',3.6);c.setAttribute('class','dot');c.style.opacity=0;dots.appendChild(c)});
/* one closed line looping around the dots: four petals through the centre */
const R=S*1.9,k=S*1.15;
const d=`M0 ${-R} C ${k} ${-R*.45} ${k} ${-R*.2} 0 0 C ${-k} ${-R*.2} ${-k} ${-R*.45} 0 ${-R} Z
M${R} 0 C ${R*.45} ${k} ${R*.2} ${k} 0 0 C ${R*.2} ${-k} ${R*.45} ${-k} ${R} 0 Z
M0 ${R} C ${-k} ${R*.45} ${-k} ${R*.2} 0 0 C ${k} ${R*.2} ${k} ${R*.45} 0 ${R} Z
M${-R} 0 C ${-R*.45} ${-k} ${-R*.2} ${-k} 0 0 C ${-R*.2} ${k} ${-R*.45} ${k} ${-R} 0 Z`;
const loop=document.getElementById('loop'),gp=document.getElementById('gpath');
loop.setAttribute('d',d);gp.setAttribute('d',d);
/* path length is per-subpath for dash purposes: use pathLength normalisation */
loop.setAttribute('pathLength','1');gp.setAttribute('pathLength','1');
loop.style.strokeDasharray='1 1';gp.style.strokeDasharray='1 1';

/* ---- Theatre.js: project, sheet, one animated object ---- */
const {core}=window.Theatre_CoreBundle||window.TheatreJS_CoreBundle||{core:window.core};
const {getProject,types}=core||window.Theatre.core||{};
const kf=(position,value,ease)=>({id:'k'+Math.random().toString(36).slice(2,8),position,connectedRight:true,handles:ease||[.4,0,.2,1],type:'bezier',value});
const tracks={};const idmap={};
function track(prop,frames){const id='t_'+prop;tracks[id]={type:'BasicKeyframedTrack',__debugName:'Kolam:["'+prop+'"]',keyframes:frames};idmap['["'+prop+'"]']=id}
track('dots',[kf(0,0),kf(1.6,1)]);
track('draw',[kf(1.2,1),kf(4.2,0,[.45,0,.55,1])]);       /* dashoffset 1 -> 0 */
track('glow',[kf(0,0),kf(3.4,0),kf(4.4,1),kf(5.8,.25)]);
track('turn',[kf(0,-14),kf(6.2,0,[.2,.6,.2,1])]);
track('word',[kf(5,0),kf(6.4,1)]);
const state={sheetsById:{Intro:{staticOverrides:{byObject:{}},sequence:{subUnitsPerUnit:30,length:7,type:'PositionalSequence',tracksByObject:{Kolam:{trackData:tracks,trackIdByPropPath:idmap}}}}},definitionVersion:'0.4.0',revisionHistory:[]};
const project=getProject('INAI motion',{state});
const sheet=project.sheet('Intro');
const o=sheet.object('Kolam',{dots:types.number(0,{range:[0,1]}),draw:types.number(1,{range:[0,1]}),glow:types.number(0,{range:[0,1]}),turn:types.number(-14),word:types.number(0,{range:[0,1]})});
const ds=dots.querySelectorAll('circle'),rot=document.getElementById('rot'),gg=document.getElementById('glowG'),bl=document.getElementById('blur'),w=document.getElementById('word'),ro=document.getElementById('ro');
o.onValuesChange(v=>{
  ds.forEach((c,i)=>{const t=Math.min(1,Math.max(0,v.dots*ds.length*.8-i*.6));c.style.opacity=t;c.setAttribute('r',3.6*(.4+.6*t))});
  loop.style.strokeDashoffset=v.draw;gp.style.strokeDashoffset=v.draw;
  gg.setAttribute('opacity',v.glow*.7);bl.setAttribute('stdDeviation',2+v.glow*5);
  rot.setAttribute('transform','translate(200 190) rotate('+v.turn+')');
  w.setAttribute('opacity',v.word);w.setAttribute('y',356-(1-v.word)*10);
});
const seq=sheet.sequence;
project.ready.then(()=>{
  const play=()=>seq.play({iterationCount:1,range:[0,7]});
  play();
  document.getElementById('play').onclick=()=>{seq.position=0;play()};
  document.getElementById('pause').onclick=()=>seq.pause();
  setInterval(()=>{ro.textContent='timeline '+seq.position.toFixed(2)+' s / 7.00 s'},100);
});
})();
</script>
</body></html>
